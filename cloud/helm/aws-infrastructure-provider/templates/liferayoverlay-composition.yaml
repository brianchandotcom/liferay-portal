apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
    annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
        argocd.argoproj.io/sync-wave: "-60"
    name: liferayoverlays.aws.liferay.com
spec:
    group: aws.liferay.com
    names:
        kind: LiferayOverlay
        plural: liferayoverlays
        shortNames:
            -   lfroverlay
            -   lro
        singular: liferayoverlay
    versions:
        -   name: v1alpha1
            referenceable: true
            schema:
                openAPIV3Schema:
                    properties:
                        spec:
                            properties:
                                commonTags:
                                    additionalProperties:
                                        type: string
                                    default: {}
                                    type: object
                                forceDestroy:
                                    default: false
                                    type: boolean
                                orphanOnDelete:
                                    type: boolean
                                projectId:
                                    type: string
                            required:
                                -   forceDestroy
                                -   orphanOnDelete
                                -   projectId
                            type: object
                        status:
                            properties:
                                bucketReady:
                                    default: false
                                    type: boolean
                            type: object
                    type: object
            served: true
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-50"
    name: liferay-aws-overlay.aws.liferay.com
spec:
    compositeTypeRef:
        apiVersion: aws.liferay.com/v1alpha1
        kind: LiferayOverlay
    mode: Pipeline
    pipeline:
        -   functionRef:
                name: function-environment-configs
            input:
                apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
                kind: Input
                spec:
                    environmentConfigs:
                        -   ref:
                                name: environment-config
                            type: Reference
            step: environment-configs
        -   functionRef:
                name: function-go-templating
            input:
                apiVersion: template.fn.crossplane.io/v1beta1
                inline:
                    template: |
                        {{`
                        {{- $env := index .context "apiextensions.crossplane.io/environment" -}}
                        {{- $xr := .observed.composite.resource -}}

                        {{- $accountId := $env.accountId -}}
                        {{- $deploymentName := $env.deploymentName -}}
                        {{- $forceDestroy := $xr.spec.forceDestroy -}}
                        {{- $iamBoundaryArn := $env.crossplaneIamBoundaryArn -}}
                        {{- $iamPath := $env.crossplaneIamPath -}}
                        {{- $managementPolicies := $xr.spec.orphanOnDelete | ternary (list "Create" "Observe" "Update") (list "*") | toJson -}}
                        {{- $namespace := $xr.metadata.namespace -}}
                        {{- $partition := $env.partition -}}
                        {{- $projectId := $xr.spec.projectId -}}
                        {{- $region := $env.region -}}

                        {{- $overlayBucketName := printf "%s-overlay-%s" $deploymentName (printf "%.18s-%s" $projectId (printf "%s-%s-%s" $accountId $deploymentName $projectId | sha256sum | trunc 6)) -}}
                        ---
                        apiVersion: s3.aws.m.upbound.io/v1beta1
                        kind: Bucket
                        metadata:
                            annotations:
                                crossplane.io/external-name: {{ $overlayBucketName }}
                                gotemplating.fn.crossplane.io/composition-resource-name: overlay-bucket
                            labels:
                                app: liferay
                                component: overlay
                                projectId: {{ $projectId }}
                            name: {{ $overlayBucketName }}
                            namespace: {{ $namespace }}
                        spec:
                            forProvider:
                                forceDestroy: {{ $forceDestroy }}
                                region: {{ $region }}
                                tags:
                                    Name: {{ $overlayBucketName }}
                            managementPolicies: {{ $managementPolicies }}
                        ---
                        apiVersion: s3.aws.m.upbound.io/v1beta1
                        kind: BucketLifecycleConfiguration
                        metadata:
                            annotations:
                                crossplane.io/external-name: {{ $overlayBucketName }}
                                gotemplating.fn.crossplane.io/composition-resource-name: overlay-bucket-lifecycle
                            labels:
                                projectId: {{ $projectId }}
                            name: {{ $overlayBucketName }}
                        spec:
                            forProvider:
                                bucketSelector:
                                    matchLabels:
                                        app: liferay
                                        component: overlay
                                        projectId: {{ $projectId }}
                                region: {{ $region }}
                                rule:
                                    -   abortIncompleteMultipartUpload:
                                            -   daysAfterInitiation: 7
                                        expiration:
                                            -   expiredObjectDeleteMarker: true
                                        id: bucket-scoped-rule
                                        noncurrentVersionExpiration:
                                            -   noncurrentDays: 7
                                        status: Enabled
                            managementPolicies: {{ $managementPolicies }}
                        ---
                        apiVersion: s3.aws.m.upbound.io/v1beta1
                        kind: BucketPublicAccessBlock
                        metadata:
                            annotations:
                                crossplane.io/external-name: {{ $overlayBucketName }}-bucket-public-access-block
                                gotemplating.fn.crossplane.io/composition-resource-name: overlay-bucket-public-access-block
                            labels:
                                projectId: {{ $projectId }}
                            name: {{ $overlayBucketName }}
                        spec:
                            forProvider:
                                blockPublicAcls: true
                                blockPublicPolicy: true
                                bucketSelector:
                                    matchLabels:
                                        app: liferay
                                        component: overlay
                                        projectId: {{ $projectId }}
                                ignorePublicAcls: true
                                region: {{ $region }}
                                restrictPublicBuckets: true
                            managementPolicies: {{ $managementPolicies }}
                        ---
                        apiVersion: s3.aws.m.upbound.io/v1beta1
                        kind: BucketVersioning
                        metadata:
                            annotations:
                                crossplane.io/external-name: {{ $overlayBucketName }}-bucket-versioning
                                gotemplating.fn.crossplane.io/composition-resource-name: overlay-bucket-versioning
                            labels:
                                app: liferay
                                component: overlay-versioning
                                projectId: {{ $projectId }}
                            name: {{ $overlayBucketName }}
                            namespace: {{ $namespace }}
                        spec:
                            forProvider:
                                bucketSelector:
                                    matchLabels:
                                        app: liferay
                                        component: overlay
                                        projectId: {{ $projectId }}
                                    namespace: {{ $namespace }}
                                region: {{ $region }}
                                versioningConfiguration:
                                    status: Enabled
                            managementPolicies: {{ $managementPolicies }}
                        ---
                        apiVersion: iam.aws.m.upbound.io/v1beta1
                        kind: Policy
                        metadata:
                            annotations:
                                crossplane.io/external-name: {{ $overlayBucketName }}-upload-only-policy
                                gotemplating.fn.crossplane.io/composition-resource-name: overlay-upload-only-policy
                            labels:
                                app: liferay
                                aws.liferay.com/username: {{ $overlayBucketName }}-ci-uploader
                                component: overlay-upload-only-policy
                                projectId: {{ $projectId }}
                            name: {{ $overlayBucketName }}-upload-only
                            namespace: {{ $namespace }}
                        spec:
                            forProvider:
                                path: {{ $iamPath }}
                                policy: |
                                    {
                                        "Statement": [
                                            {
                                                "Action": [
                                                    "s3:ListBucket"
                                                ],
                                                "Effect": "Allow",
                                                "Resource": [
                                                    "arn:{{ $partition }}:s3:::{{ $overlayBucketName }}"
                                                ],
                                                "Sid": "AllowListBucket"
                                            },
                                            {
                                                "Action": [
                                                    "s3:PutObject"
                                                ],
                                                "Effect": "Allow",
                                                "Resource": [
                                                    "arn:{{ $partition }}:s3:::{{ $overlayBucketName }}/*"
                                                ],
                                                "Sid": "AllowPutBucket"
                                            },
                                            {
                                                "Action": [
                                                    "s3:DeleteObject",
                                                    "s3:DeleteObjectVersion"
                                                ],
                                                "Effect": "Deny",
                                                "Resource": [
                                                    "arn:{{ $partition }}:s3:::{{ $overlayBucketName }}",
                                                    "arn:{{ $partition }}:s3:::{{ $overlayBucketName }}/*"
                                                ],
                                                "Sid": "DenyDeleteBucket"
                                            }
                                        ],
                                       "Version": "2012-10-17"
                                    }
                            managementPolicies: {{ $managementPolicies }}
                        ---
                        apiVersion: iam.aws.m.upbound.io/v1beta1
                        kind: User
                        metadata:
                            annotations:
                                crossplane.io/external-name: {{ $overlayBucketName }}-ci-uploader-user
                                gotemplating.fn.crossplane.io/composition-resource-name: overlay-ci-uploader-user
                            labels:
                                aws.liferay.com/username: {{ $overlayBucketName }}-ci-uploader
                            name: {{ $overlayBucketName }}-ci-uploader
                            namespace: {{ $namespace }}
                        spec:
                            forProvider:
                                forceDestroy: {{ $forceDestroy }}
                                path: {{ $iamPath }}
                                permissionsBoundary: {{ $iamBoundaryArn }}
                        ---
                        apiVersion: iam.aws.m.upbound.io/v1beta1
                        kind: UserPolicyAttachment
                        metadata:
                            annotations:
                                crossplane.io/external-name: {{ $overlayBucketName }}-ci-uploader-user-policy-attachment
                                gotemplating.fn.crossplane.io/composition-resource-name: overlay-ci-uploader-user-policy-attachment
                            name: {{ $overlayBucketName }}-ci-uploader
                            namespace: {{ $namespace }}
                        spec:
                            forProvider:
                                policyArnSelector:
                                    matchLabels:
                                        aws.liferay.com/username: {{ $overlayBucketName }}-ci-uploader
                                userSelector:
                                    matchLabels:
                                        aws.liferay.com/username: {{ $overlayBucketName }}-ci-uploader
                        ---
                        apiVersion: iam.aws.m.upbound.io/v1beta1
                        kind: AccessKey
                        metadata:
                            annotations:
                                gotemplating.fn.crossplane.io/composition-resource-name: overlay-ci-uploader-access-key
                            name: {{ $overlayBucketName }}-ci-uploader
                            namespace: {{ $namespace }}
                        spec:
                            forProvider:
                                userSelector:
                                    matchLabels:
                                        aws.liferay.com/username: {{ $overlayBucketName }}-ci-uploader
                            writeConnectionSecretToRef:
                                name: {{ $overlayBucketName }}-ci-uploader-access-key
                        ---
                        apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
                        kind: Context
                        data:
                            apiextensions.crossplane.io/environment:
                                apiVersion: internal.crossplane.io/v1alpha1
                                defaultTags:
                                    DeploymentName: {{ $deploymentName | quote }}
                                    ProjectId: {{ $projectId | quote }}
                                kind: Environment
                        `}}
                kind: GoTemplate
                source: Inline
            step: overlay
        -   functionRef:
                name: function-tag-manager
            input:
                addTags:
                    -   fromFieldPath: spec.commonTags
                        type: FromCompositeFieldPath
                    -   fromFieldPath: defaultTags
                        type: FromEnvironmentFieldPath
                apiVersion: tag-manager.fn.crossplane.io/v1beta1
                kind: ManagedTags
            step: apply-default-tags
        -   functionRef:
                name: function-auto-ready
            step: auto-detect-ready-composed-resources