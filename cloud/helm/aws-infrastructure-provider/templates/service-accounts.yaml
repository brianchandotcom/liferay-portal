        argocd.argoproj.io/sync-wave: "-100"
        eks.amazonaws.com/role-arn: {{ .Values.deploymentContext.crossplaneIamRoleArn | quote }}
    name: crossplane-iam
    namespace: {{ .Values.crossplaneNamespace }}