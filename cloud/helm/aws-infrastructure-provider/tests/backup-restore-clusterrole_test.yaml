release:
    name: my-release
    namespace: crossplane-system
suite: Backup Restore ClusterRole
templates:
    -   charts/liferay-subchart-backup-restore/templates/clusterrole.yaml
tests:
    -   asserts:
            -   notContains:
                    any: true
                    content:
                        resources: ["secrets"]
                    path: rules
        it: Grants no access to secrets
    -   asserts:
            -   equal:
                    path: metadata.labels["component"]
                    value: backup-restore-platform
            -   equal:
                    path: metadata.name
                    value: backup-restore-cluster-role
            -   equal:
                    path: rules
                    value:
                        -   apiGroups: [""]
                            resources: ["namespaces"]
                            verbs: ["get", "list"]
                        -   apiGroups: ["apps"]
                            resources: ["statefulsets"]
                            verbs: ["get", "list", "patch", "watch"]
                        -   apiGroups: ["argoproj.io"]
                            resources: ["workflowtaskresults"]
                            verbs: ["create", "patch"]
                        -   apiGroups: ["aws.liferay.com"]
                            resources: ["liferayinfrastructures"]
                            verbs: ["get", "list", "patch", "watch"]
                        -   apiGroups: ["backup.aws.m.upbound.io"]
                            resources: ["vaults"]
                            verbs: ["get", "list"]
                        -   apiGroups: ["iam.aws.m.upbound.io"]
                            resources: ["roles"]
                            verbs: ["get", "list"]
                        -   apiGroups: ["s3.aws.m.upbound.io"]
                            resources: ["buckets"]
                            verbs: ["get", "list"]
            -   hasDocuments:
                    count: 1
            -   isKind:
                    of: ClusterRole
        it: Renders the backup restore cluster role