release:
    name: my-release
    namespace: crossplane-system
suite: Backup Restore ClusterWorkflowTemplate
templates:
    -   charts/liferay-subchart-backup-restore/templates/clusterworkflowtemplate.yaml
tests:
    -   asserts:
            -   equal:
                    path: spec.templates[?(@.name=="sanitize-database")].activeDeadlineSeconds
                    value: 600
        it: Sizes the sanitization timeout from the values
        set:
            liferay-subchart-backup-restore.restoreSanitization.timeoutSeconds: 600