release:
    name: my-release
    namespace: crossplane-system
suite: Cluster Provider Configs
templates:
    -   templates/cluster-provider-configs.yaml
tests:
    -   asserts:
            -   hasDocuments:
                    count: 1
            -   equal:
                    path: apiVersion
                    value: aws.m.upbound.io/v1beta1
            -   equal:
                    path: metadata.name
                    value: default
            -   equal:
                    path: spec.credentials.source
                    value: IRSA
            -   isKind:
                    of: ClusterProviderConfig
        it: Renders one IRSA provider config that follows each provider service account role