release:
    name: my-release
    namespace: crossplane-system
suite: Compositions
templates:
    -   templates/liferayinfrastructure-composition.yaml
    -   templates/liferayoverlay-composition.yaml
tests:
    -   asserts:
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: 'deletionProtection: \{\{ not \$forceDestroy \}\}\n'
                template: templates/liferayinfrastructure-composition.yaml
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: 'engine: postgres\n'
                template: templates/liferayinfrastructure-composition.yaml
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: '\n +username: liferay_database_admin\n'
                template: templates/liferayinfrastructure-composition.yaml
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: 'masterUserName: liferay_search_admin\n'
                template: templates/liferayinfrastructure-composition.yaml
        it: Derives database deletion protection from force destroy and fixes the engine and administrator names
    -   asserts:
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: 'crossplane\.io/external-name: \{\{ \$baseName \}\}-liferay-role\n(?:.*\n)*? +path: \{\{ \$iamPath \}\}\n +permissionsBoundary: \{\{ \$iamBoundaryArn \}\}'
                template: templates/liferayinfrastructure-composition.yaml
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: '"\{\{ \$oidcProvider \}\}:sub": "system:serviceaccount:\{\{ \$namespace \}\}:liferay-default"'
                template: templates/liferayinfrastructure-composition.yaml
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: 'kind: ServiceAccount\n +metadata:\n +annotations:\n +eks\.amazonaws\.com/role-arn: \{\{ \$liferayRoleArn \}\}\n(?:.*\n)*? +name: liferay-default'
                template: templates/liferayinfrastructure-composition.yaml
            -   documentIndex: 1
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: '\n +role: '
                template: templates/liferayinfrastructure-composition.yaml
        it: Gives each environment its own Liferay role and service account inside the Crossplane IAM fence
    -   asserts:
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: '\}\{\{ if \$overlayAccess\.enabled \}\},\n(?:.*\n)*? +"arn:\{\{ \$partition \}\}:s3:::\{\{ \$overlayBucketName \}\}/\*"\n +\]\n +\}\{\{ end \}\}'
                template: templates/liferayinfrastructure-composition.yaml
        it: Grants the Liferay role read on the project overlay bucket only when overlay access is enabled
    -   asserts:
            -   documentIndex: 1
                equal:
                    path: spec.pipeline[0]
                    value:
                        functionRef:
                            name: function-environment-configs
                        input:
                            apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
                            kind: Input
                            spec:
                                environmentConfigs:
                                    -   ref:
                                            name: environment-config
                                        type: Reference
                        step: environment-configs
        it: Loads the environment config ahead of templating
    -   asserts:
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: '\n( +)Name: \{\{ \$storageName \}\}-\{\{ \$dataPlane \}\}\n +\{\{- with \$storageSpec\.tags \}\}\n +\{\{- \. \| toYaml \| nindent 12 \}\}\n'
                template: templates/liferayinfrastructure-composition.yaml
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: '\{\{- with \$backupSpec\.vaultTags \}\}\n +tags:\n +\{\{- \. \| toYaml \| nindent 12 \}\}\n'
                template: templates/liferayinfrastructure-composition.yaml
        it: Merges the environment's storage and vault tags at the tag map's own indentation
    -   asserts:
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: 'path: \{\{ \$iamPath \}\}\n +permissionsBoundary: \{\{ \$iamBoundaryArn \}\}'
            -   documentIndex: 1
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: 'arn:aws:'
        it: Places the composed IAM identities under the Crossplane IAM path and boundary in the deployment partition
    -   asserts:
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: '\$env := index \.context "apiextensions\.crossplane\.io/environment"'
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: '\$oidcProvider := trimPrefix "https://" \$env\.oidcIssuerUrl'
                template: templates/liferayinfrastructure-composition.yaml
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: '\$baseRegion := \$env\.region'
                template: templates/liferayinfrastructure-composition.yaml
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: '\$region := \$env\.region'
                template: templates/liferayoverlay-composition.yaml
            -   documentIndex: 1
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: 'xr\.spec\.region|databaseSpec\.region|searchSpec\.region'
        it: Reads the deployment facts from the environment config
    -   asserts:
            -   documentIndex: 1
                equal:
                    path: spec.pipeline[-2].input.addTags
                    value:
                        -   fromFieldPath: spec.commonTags
                            type: FromCompositeFieldPath
                        -   fromFieldPath: defaultTags
                            type: FromEnvironmentFieldPath
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: 'kind: Context\ndata:\n +apiextensions\.crossplane\.io/environment:\n +apiVersion: internal\.crossplane\.io/v1alpha1\n +defaultTags:\n +DeploymentName: \{\{ \$deploymentName \| quote \}\}\n +EnvironmentId: \{\{ \$environmentId \| quote \}\}\n +ProjectId: \{\{ \$projectId \| quote \}\}\n'
                template: templates/liferayinfrastructure-composition.yaml
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: 'kind: Context\ndata:\n +apiextensions\.crossplane\.io/environment:\n +apiVersion: internal\.crossplane\.io/v1alpha1\n +defaultTags:\n +DeploymentName: \{\{ \$deploymentName \| quote \}\}\n +ProjectId: \{\{ \$projectId \| quote \}\}\n'
                template: templates/liferayoverlay-composition.yaml
        it: Tags every composed resource with the environment's common tags and the identifier tags derived in the composition