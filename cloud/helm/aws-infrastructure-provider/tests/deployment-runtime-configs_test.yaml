release:
    name: my-release
    namespace: crossplane-system
set:
    deploymentContext:
        crossplaneDataRoleArn: arn:aws:iam::000000000000:role/liferay-test-crossplane-data
        crossplaneIamRoleArn: arn:aws:iam::000000000000:role/liferay-test-crossplane-iam
suite: Deployment Runtime Configs
templates:
    -   templates/deployment-runtime-configs.yaml
tests:
    -   asserts:
            -   documentIndex: 8
                equal:
                    path: spec.deploymentTemplate.spec.template.spec.containers[0].resources
                    value:
                        limits:
                            memory: 2Gi
                        requests:
                            cpu: 126m
                            memory: 768Mi
            -   documentIndex: 8
                equal:
                    path: spec.deploymentTemplate.spec.template.spec.securityContext.runAsNonRoot
                    value: true
        it: Keeps the per provider resource tuning and the restricted security context
    -   asserts:
            -   hasDocuments:
                    count: 9
            -   documentIndex: 0
                equal:
                    path: metadata.name
                    value: aws-backup-config
            -   documentIndex: 0
                equal:
                    path: spec.serviceAccountTemplate.metadata.annotations["eks.amazonaws.com/role-arn"]
                    value: arn:aws:iam::000000000000:role/liferay-test-crossplane-data
            -   documentIndex: 0
                equal:
                    path: spec.serviceAccountTemplate.metadata.name
                    value: crossplane-data
            -   documentIndex: 1
                equal:
                    path: metadata.name
                    value: aws-cloudwatchlogs-config
            -   documentIndex: 1
                equal:
                    path: spec.serviceAccountTemplate.metadata.annotations["eks.amazonaws.com/role-arn"]
                    value: arn:aws:iam::000000000000:role/liferay-test-crossplane-data
            -   documentIndex: 1
                equal:
                    path: spec.serviceAccountTemplate.metadata.name
                    value: crossplane-data
            -   documentIndex: 2
                equal:
                    path: metadata.name
                    value: aws-ec2-config
            -   documentIndex: 2
                equal:
                    path: spec.serviceAccountTemplate.metadata.annotations["eks.amazonaws.com/role-arn"]
                    value: arn:aws:iam::000000000000:role/liferay-test-crossplane-data
            -   documentIndex: 2
                equal:
                    path: spec.serviceAccountTemplate.metadata.name
                    value: crossplane-data
            -   documentIndex: 3
                equal:
                    path: metadata.name
                    value: aws-family-config
            -   documentIndex: 3
                equal:
                    path: spec.serviceAccountTemplate.metadata.annotations["eks.amazonaws.com/role-arn"]
                    value: arn:aws:iam::000000000000:role/liferay-test-crossplane-data
            -   documentIndex: 3
                equal:
                    path: spec.serviceAccountTemplate.metadata.name
                    value: crossplane-data
            -   documentIndex: 4
                equal:
                    path: metadata.name
                    value: aws-iam-config
            -   documentIndex: 4
                equal:
                    path: spec.serviceAccountTemplate.metadata.annotations["eks.amazonaws.com/role-arn"]
                    value: arn:aws:iam::000000000000:role/liferay-test-crossplane-iam
            -   documentIndex: 4
                equal:
                    path: spec.serviceAccountTemplate.metadata.name
                    value: crossplane-iam
            -   documentIndex: 5
                equal:
                    path: metadata.name
                    value: aws-kms-config
            -   documentIndex: 5
                equal:
                    path: spec.serviceAccountTemplate.metadata.annotations["eks.amazonaws.com/role-arn"]
                    value: arn:aws:iam::000000000000:role/liferay-test-crossplane-data
            -   documentIndex: 5
                equal:
                    path: spec.serviceAccountTemplate.metadata.name
                    value: crossplane-data
            -   documentIndex: 6
                equal:
                    path: metadata.name
                    value: aws-opensearch-config
            -   documentIndex: 6
                equal:
                    path: spec.serviceAccountTemplate.metadata.annotations["eks.amazonaws.com/role-arn"]
                    value: arn:aws:iam::000000000000:role/liferay-test-crossplane-data
            -   documentIndex: 6
                equal:
                    path: spec.serviceAccountTemplate.metadata.name
                    value: crossplane-data
            -   documentIndex: 7
                equal:
                    path: metadata.name
                    value: aws-rds-config
            -   documentIndex: 7
                equal:
                    path: spec.serviceAccountTemplate.metadata.annotations["eks.amazonaws.com/role-arn"]
                    value: arn:aws:iam::000000000000:role/liferay-test-crossplane-data
            -   documentIndex: 7
                equal:
                    path: spec.serviceAccountTemplate.metadata.name
                    value: crossplane-data
            -   documentIndex: 8
                equal:
                    path: metadata.name
                    value: aws-s3-config
            -   documentIndex: 8
                equal:
                    path: spec.serviceAccountTemplate.metadata.annotations["eks.amazonaws.com/role-arn"]
                    value: arn:aws:iam::000000000000:role/liferay-test-crossplane-data
            -   documentIndex: 8
                equal:
                    path: spec.serviceAccountTemplate.metadata.name
                    value: crossplane-data
        it: Runs only the IAM provider as the crossplane-iam service account and every other provider as crossplane-data