release:
    name: my-release
    namespace: my-namespace
suite: LiferayInfrastructure Composition
templates:
    -   templates/liferayinfrastructure-composition.yaml
tests:
    -   asserts:
            -   matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "crossplane\\.io/external-name: \\{\\{ \\$baseName \\}\\}-liferay-role\\n(?:.*\\n)*? +path: \\{\\{ \\$iamPath \\}\\}\\n +permissionsBoundary: \\{\\{ \\$iamBoundaryArn \\}\\}"
            -   matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\"\\{\\{ \\$oidcProvider \\}\\}:sub\": \"system:serviceaccount:\\{\\{ \\$namespace \\}\\}:liferay-default\""
            -   matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "kind: ServiceAccount\\n +metadata:\\n +annotations:\\n +eks\\.amazonaws\\.com/role-arn: \\{\\{ \\$liferayRoleArn \\}\\}\\n(?:.*\\n)*? +name: liferay-default"
            -   notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\n +role: "
        documentSelector:
            path: kind
            value: Composition
        it: Gives each environment its own Liferay role and service account inside the Crossplane IAM fence
    -   asserts:
            -   matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\}\\{\\{ if \\$overlayAccess\\.enabled \\}\\},\\n(?:.*\\n)*? +\"arn:\\{\\{ \\$partition \\}\\}:s3:::\\{\\{ \\$overlayBucketName \\}\\}/\\*\"\\n +\\]\\n +\\}\\{\\{ end \\}\\}"
        documentSelector:
            path: kind
            value: Composition
        it: Grants the Liferay role read access to the project overlay bucket only when overlay access is enabled
    -   asserts:
            -   equal:
                    path: spec.pipeline[0]
                    value:
                        functionRef:
                            name: function-environment-configs
                        input:
                            apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
                            kind: Input
                            spec:
                                environmentConfigs:
                                    -   ref:
                                            name: environment-config
                                        type: Reference
                        step: environment-configs
        documentSelector:
            path: kind
            value: Composition
        it: Loads the environment config ahead of templating
    -   asserts:
            -   matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\n( +)Name: \\{\\{ \\$storageName \\}\\}-\\{\\{ \\$dataPlane \\}\\}\\n +\\{\\{- with \\$storageSpec\\.tags \\}\\}\\n +\\{\\{- \\. \\| toYaml \\| nindent 12 \\}\\}\\n"
            -   matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\{\\{- with \\$backupSpec\\.vaultTags \\}\\}\\n +tags:\\n +\\{\\{- \\. \\| toYaml \\| nindent 12 \\}\\}\\n"
        documentSelector:
            path: kind
            value: Composition
        it: Merges the environment's storage and vault tags at the tag map's own indentation
    -   asserts:
            -   matchRegex:
                    path: spec.pipeline[2].input.inline.template
                    pattern: "name: \\{\\{ \\$elasticsearchName \\}\\}\\n\\s+namespace: \\{\\{ \\$elasticsearchNamespace \\}\\}"
            -   matchRegex:
                    path: spec.pipeline[2].input.inline.template
                    pattern: "name: \\{\\{ \\$elasticsearchSecretName \\}\\}\\n\\s+namespace: \\{\\{ \\$elasticsearchNamespace \\}\\}"
        documentSelector:
            path: kind
            value: Composition
        it: Observes the Elasticsearch resource and its secret in the dedicated namespace
    -   asserts:
            -   matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "path: \\{\\{ \\$iamPath \\}\\}\\n +permissionsBoundary: \\{\\{ \\$iamBoundaryArn \\}\\}"
            -   notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "arn:aws:"
        documentSelector:
            path: kind
            value: Composition
        it: Places the composed IAM identities under the Crossplane IAM path and boundary in the deployment partition
    -   asserts:
            -   matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "deletionProtection: \\{\\{ and \\(not \\$forceDestroy\\) \\(eq \\$dataPlane \\$activeDataPlane\\) \\}\\}\\n"
            -   matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "engine: postgres\\n"
            -   matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\n +username: liferay_database_admin\\n"
            -   matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "masterUserName: liferay_search_admin\\n"
        documentSelector:
            path: kind
            value: Composition
        it: Protects only the active data plane database unless force destroy is set and fixes the engine and administrator names
    -   asserts:
            -   matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\{\\{- if \\$backupRestoreRoleArn \\}\\}\\n---\\napiVersion: kubernetes\\.m\\.crossplane\\.io/v1alpha1\\nkind: Object\\nmetadata:\\n +annotations:\\n +gotemplating\\.fn\\.crossplane\\.io/composition-resource-name: backup-restore-service-account\\n"
            -   matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\{\\{- if \\$liferayRoleArn \\}\\}\\n---\\napiVersion: kubernetes\\.m\\.crossplane\\.io/v1alpha1\\nkind: Object\\nmetadata:\\n +annotations:\\n +gotemplating\\.fn\\.crossplane\\.io/composition-resource-name: liferay-service-account\\n"
        documentSelector:
            path: kind
            value: Composition
        it: Publishes each service account only once its role ARN is known
    -   asserts:
            -   matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\$env := index \\.context \"apiextensions\\.crossplane\\.io/environment\""
            -   matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\$oidcProvider := trimPrefix \"https://\" \\$env\\.oidcIssuerUrl"
            -   matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\$baseRegion := \\$env\\.region"
            -   notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "xr\\.spec\\.region|databaseSpec\\.region|searchSpec\\.region"
        documentSelector:
            path: kind
            value: Composition
        it: Reads the deployment facts from the environment config
    -   asserts:
            -   matchRegex:
                    path: spec.pipeline[2].input.inline.template
                    pattern: "SEARCH_URL: http://\\{\\{ \\$elasticsearchName \\}\\}-es-http\\.\\{\\{ \\$elasticsearchNamespace \\}\\}\\.svc:9200"
        documentSelector:
            path: kind
            value: Composition
        it: Resolves the search URL through the dedicated Elasticsearch namespace
    -   asserts:
            -   equal:
                    path: spec.pipeline[-2].input.addTags
                    value:
                        -   fromFieldPath: spec.commonTags
                            type: FromCompositeFieldPath
                        -   fromFieldPath: defaultTags
                            type: FromEnvironmentFieldPath
            -   matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "apiVersion: meta\\.gotemplating\\.fn\\.crossplane\\.io/v1alpha1\\ndata:\\n +apiextensions\\.crossplane\\.io/environment:\\n +apiVersion: internal\\.crossplane\\.io/v1alpha1\\n +defaultTags:\\n +DeploymentName: \\{\\{ \\$deploymentName \\| quote \\}\\}\\n +EnvironmentId: \\{\\{ \\$environmentId \\| quote \\}\\}\\n +ProjectId: \\{\\{ \\$projectId \\| quote \\}\\}\\n +kind: Environment\\nkind: Context\\n"
        documentSelector:
            path: kind
            value: Composition
        it: Tags every composed resource with the environment's common tags and the identifier tags derived in the composition
    -   asserts:
            -   matchRegex:
                    path: spec.pipeline[2].input.inline.template
                    pattern: "name: search-connection-details\\n\\s+namespace: \\{\\{ \\$namespace \\}\\}"
        documentSelector:
            path: kind
            value: Composition
        it: Writes the search connection details beside the Liferay workload