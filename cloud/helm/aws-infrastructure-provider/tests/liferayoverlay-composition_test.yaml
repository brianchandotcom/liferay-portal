release:
    name: my-release
    namespace: my-namespace
suite: LiferayOverlay Composition
templates:
    -   templates/liferayoverlay-composition.yaml
tests:
    -   asserts:
            -   matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "^\\{\\{- \\$env := "
            -   matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\n---\\n\\napiVersion: meta\\.gotemplating\\.fn\\.crossplane\\.io/v1alpha1\\n(?:[^-].*\\n)*kind: Context\\n$"
        documentSelector:
            path: kind
            value: Composition
        it: Concatenates the globals and then every section file in order into the templating step