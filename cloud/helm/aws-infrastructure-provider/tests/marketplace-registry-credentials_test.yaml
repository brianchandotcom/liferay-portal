release:
    name: my-release
    namespace: crossplane-system
suite: Marketplace Registry Credentials
templates:
    -   templates/marketplace-registry-credentials.yaml
tests:
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the Marketplace registry credentials by default
    -   asserts:
            -   hasDocuments:
                    count: 2
            -   documentIndex: 0
                equal:
                    path: spec.target.template.data.password
                    value: "{{ .password }}"
            -   documentIndex: 0
                equal:
                    path: spec.target.template.data.username
                    value: "{{ .username }}"
        it: Renders the Marketplace registry credentials with the External Secrets placeholders intact when enabled
        set:
            marketplace:
                enabled: true