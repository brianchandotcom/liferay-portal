release:
    name: my-release
    namespace: crossplane-system
suite: Providers
templates:
    -   templates/providers.yaml
tests:
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the providers when they are disabled
        set:
            providers:
                enabled: false
    -   asserts:
            -   hasDocuments:
                    count: 9
            -   documentIndex: 0
                equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-80"
            -   documentIndex: 8
                equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-85"
            -   documentIndex: 8
                equal:
                    path: metadata.name
                    value: provider-family-aws
        it: Renders the AWS provider family by default, with the family provider one wave ahead