release:
    name: my-release
    namespace: crossplane-system
suite: RBAC
templates:
    -   templates/rbac.yaml
tests:
    -   asserts:
            -   documentIndex: 1
                equal:
                    path: subjects[0].namespace
                    value: custom-system
        it: Follows the Crossplane namespace override
        set:
            crossplaneNamespace: custom-system
    -   asserts:
            -   contains:
                    content:
                        apiGroups: ["elasticsearch.k8s.elastic.co"]
                        resources: ["elasticsearches"]
                        verbs: ["get", "list", "patch", "watch"]
                    path: rules
                documentIndex: 0
        it: Grants required permissions on ElasticSearch resources
    -   asserts:
            -   hasDocuments:
                    count: 2
            -   documentIndex: 0
                isKind:
                    of: ClusterRole
            -   documentIndex: 0
                equal:
                    path: metadata.name
                    value: crossplane-provider-kubernetes
            -   documentIndex: 0
                equal:
                    path: rules
                    value:
                        -   apiGroups: [""]
                            resources: ["configmaps", "secrets", "serviceaccounts"]
                            verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
                        -   apiGroups: [""]
                            resources: ["namespaces"]
                            verbs: ["get", "list"]
                        -   apiGroups: ["elasticsearch.k8s.elastic.co"]
                            resources: ["elasticsearches"]
                            verbs: ["get", "list", "patch", "watch"]
                        -   apiGroups: ["rbac.authorization.k8s.io"]
                            resources: ["clusterroles"]
                            verbs: ["bind", "get", "list", "watch"]
                        -   apiGroups: ["rbac.authorization.k8s.io"]
                            resources: ["rolebindings"]
                            verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
            -   documentIndex: 1
                isKind:
                    of: ClusterRoleBinding
            -   documentIndex: 1
                equal:
                    path: roleRef.name
                    value: crossplane-provider-kubernetes
            -   documentIndex: 1
                equal:
                    path: subjects[0].name
                    value: provider-kubernetes
        it: Renders only the provider-kubernetes role and binding, leaving the AWS providers to the Crossplane RBAC manager