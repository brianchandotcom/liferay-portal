release:
    name: my-release
    namespace: crossplane-system
set:
    deploymentContext:
        crossplaneDataRoleArn: arn:aws:iam::000000000000:role/liferay-test-crossplane-data
        crossplaneIamRoleArn: arn:aws:iam::000000000000:role/liferay-test-crossplane-iam
suite: Service Accounts
templates:
    -   templates/service-accounts.yaml
tests:
    -   asserts:
            -   documentIndex: 0
                equal:
                    path: metadata.namespace
                    value: custom-system
            -   documentIndex: 1
                equal:
                    path: metadata.namespace
                    value: custom-system
        it: Follows the Crossplane namespace override
        set:
            crossplaneNamespace: custom-system
    -   asserts:
            -   hasDocuments:
                    count: 2
            -   documentIndex: 0
                equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-100"
            -   documentIndex: 0
                equal:
                    path: metadata.annotations["eks.amazonaws.com/role-arn"]
                    value: arn:aws:iam::000000000000:role/liferay-test-crossplane-data
            -   documentIndex: 0
                equal:
                    path: metadata.name
                    value: crossplane-data
            -   documentIndex: 0
                equal:
                    path: metadata.namespace
                    value: crossplane-system
            -   documentIndex: 1
                equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-100"
            -   documentIndex: 1
                equal:
                    path: metadata.annotations["eks.amazonaws.com/role-arn"]
                    value: arn:aws:iam::000000000000:role/liferay-test-crossplane-iam
            -   documentIndex: 1
                equal:
                    path: metadata.name
                    value: crossplane-iam
            -   documentIndex: 1
                equal:
                    path: metadata.namespace
                    value: crossplane-system
        it: Renders the Crossplane data and IAM service accounts bound to their workload identities before the providers start