{{- if .Values.overlayBucket.enabled -}}
apiVersion: aws.liferay.com/v1alpha1
kind: LiferayOverlay
metadata:
    annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
        argocd.argoproj.io/sync-wave: "-20"
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
spec:
    {{- with .Values.overlayBucket.commonTags }}
    commonTags:
        {{- . | toYaml | nindent 8 }}
    {{- end }}
    forceDestroy: {{ .Values.overlayBucket.forceDestroy }}
    orphanOnDelete: {{ .Values.overlayBucket.orphanOnDelete }}
    projectId: {{ .Values.projectId }}
{{- end -}}