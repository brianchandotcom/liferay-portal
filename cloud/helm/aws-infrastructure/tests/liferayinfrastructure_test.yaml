release:
    name: my-release
    namespace: my-namespace
suite: LiferayInfrastructure
templates:
    -   templates/liferayinfrastructure.yaml
tests:
    -   asserts:
            -   isEmpty:
                    path: spec.backup.vaultTags
            -   isEmpty:
                    path: spec.storage.tags
        it: Defaults the storage tags and backup vault tags to empty maps
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: my-release
            -   equal:
                    path: metadata.namespace
                    value: my-namespace
            -   hasDocuments:
                    count: 1
            -   isKind:
                    of: LiferayInfrastructure
        it: Names the LiferayInfrastructure after the release
        set:
            enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the LiferayInfrastructure when the chart is disabled
        set:
            enabled: false
    -   asserts:
            -   notExists:
                    path: spec.database.deletionProtection
            -   notExists:
                    path: spec.database.engine
            -   notExists:
                    path: spec.database.username
            -   notExists:
                    path: spec.search.opensearch.username
        it: Omits the database and search settings the composition derives or fixes
    -   asserts:
            -   equal:
                    path: spec.backup.enabled
                    value: true
            -   equal:
                    path: spec.backup.rules[0].ruleName
                    value: daily-backups
            -   notExists:
                    path: spec.backup.restore
        it: Omits the restore sanitization scripts from the spec
        set:
            backup.enabled: true
            backup.restore.sanitizationScripts.x-010-fix-urls: UPDATE Foo SET url = 'https://a.example.com';
    -   asserts:
            -   equal:
                    path: spec.commonTags
                    value:
                        CostCenter: "42"
        it: Passes only the environment's own common tags
        set:
            commonTags.CostCenter: "42"
    -   asserts:
            -   equal:
                    path: spec.backup.region
                    value: eu-west-1
        it: Propagates the backup region into the spec
        set:
            backup.region: eu-west-1
    -   asserts:
            -   equal:
                    path: spec.environmentId
                    value: env-123
            -   equal:
                    path: spec.projectId
                    value: proj-456
            -   notExists:
                    path: spec.commonTags
            -   notExists:
                    path: spec.region
        it: Propagates the environment and project, leaving the cluster region and the identifier tags to the composition
        set:
            environmentId: env-123
            projectId: proj-456
            region: us-east-1
    -   asserts:
            -   equal:
                    path: spec.backup.vaultTags.spend_area
                    value: storage
            -   equal:
                    path: spec.storage.tags.resource_type
                    value: backup
        it: Propagates the storage tags and backup vault tags into the spec
        set:
            backup.vaultTags.spend_area: storage
            storage.tags.resource_type: backup
    -   asserts:
            -   equal:
                    path: spec.search.elasticsearch.enabled
                    value: false
        it: Reflects the disabled Elasticsearch search engine by default
    -   asserts:
            -   equal:
                    path: spec.search.elasticsearch.enabled
                    value: true
        it: Reflects the enabled Elasticsearch search engine when toggled on
        set:
            search.elasticsearch.enabled: true