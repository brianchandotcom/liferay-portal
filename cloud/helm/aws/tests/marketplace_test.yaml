suite: Marketplace Volume
templates:
    -   charts/liferay-default/templates/marketplace-pv.yaml
tests:
    -   asserts:
            -   equal:
                    path: spec.volumeName
                    value: NAMESPACE-marketplace
        documentSelector:
            path: kind
            skipEmptyTemplates: true
            value: PersistentVolumeClaim
        it: Names the marketplace claim's volume after the release namespace
        release:
            namespace: NAMESPACE
        set:
            liferay-default.licensing.enabled: true
            liferay-default.marketplace.csi.volumeHandle: fs-0123456789abcdef0::fsap-0123456789abcdef0
            liferay-default.marketplace.enabled: true
    -   asserts:
            -   equal:
                    path: spec.csi.volumeHandle
                    value: fs-0123456789abcdef0::fsap-0123456789abcdef0
        documentSelector:
            path: kind
            skipEmptyTemplates: true
            value: PersistentVolume
        it: Passes the EFS volume handle to the marketplace volume
        set:
            liferay-default.licensing.enabled: true
            liferay-default.marketplace.csi.volumeHandle: fs-0123456789abcdef0::fsap-0123456789abcdef0
            liferay-default.marketplace.enabled: true