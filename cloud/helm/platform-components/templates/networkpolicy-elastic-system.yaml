{{- $eckOperator := .Values.operatorApplications.eckOperator -}}
{{- if $eckOperator.enabled -}}
{{- include "liferay-platform.requireAPIServerSources" (dict "apiServerSources" .Values.networkPolicy.apiServerSources "operatorApplication" "eckOperator") -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    labels:
        {{- include "liferay-platform.labels" $ | nindent 8 }}
    name: default-deny-ingress
    namespace: {{ $eckOperator.namespace }}
spec:
    podSelector: {}
    policyTypes:
        -   Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    labels:
        {{- include "liferay-platform.labels" $ | nindent 8 }}
    name: elastic-operator-webhook-ingress
    namespace: {{ $eckOperator.namespace }}
spec:
    ingress:
        -   from:
                {{- toYaml .Values.networkPolicy.apiServerSources | nindent 16 }}
            ports:
                -   port: https-webhook
                    protocol: TCP
    podSelector:
        matchLabels:
            app.kubernetes.io/instance: {{ $eckOperator.name }}
            app.kubernetes.io/name: elastic-operator
    policyTypes:
        -   Ingress
{{- end -}}