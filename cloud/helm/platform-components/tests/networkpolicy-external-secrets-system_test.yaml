release:
    name: my-release
    namespace: argocd-system
set:
    networkPolicy.apiServerSources:
        -   ipBlock:
                cidr: 10.0.0.0/16
suite: External Secrets System NetworkPolicies
templates:
    -   templates/networkpolicy-external-secrets-system.yaml
tests:
    -   asserts:
            -   equal:
                    path: spec.ingress[0].from
                    value:
                        -   ipBlock:
                                cidr: 10.0.0.0/16
        documentSelector:
            path: metadata.name
            value: external-secrets-webhook-ingress
        it: Admits the API server sources to the webhook
    -   asserts:
            -   equal:
                    path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
                    value: monitoring
        documentSelector:
            path: metadata.name
            value: external-secrets-metrics-ingress
        it: Admits the observability namespace to the metrics port when observability is enabled
        set:
            observability.enabled: true
            observability.namespace: monitoring
    -   asserts:
            -   failedTemplate:
                    errorMessage: The value "networkPolicy.apiServerSources" must not be empty when "operatorApplications.externalSecrets.enabled" is true
        it: Fails without API server sources rather than admitting everyone
        set:
            networkPolicy.apiServerSources: []
    -   asserts:
            -   documentSelector:
                    path: metadata.name
                    value: default-deny-ingress
                equal:
                    path: metadata.namespace
                    value: secrets-system
            -   documentSelector:
                    path: metadata.name
                    value: external-secrets-webhook-ingress
                equal:
                    path: spec.podSelector.matchLabels["app.kubernetes.io/instance"]
                    value: secrets-operator
        it: Follows the External Secrets application's name and namespace
        set:
            operatorApplications.externalSecrets.name: secrets-operator
            operatorApplications.externalSecrets.namespace: secrets-system
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits every NetworkPolicy when External Secrets is disabled
        set:
            networkPolicy.apiServerSources: []
            operatorApplications.externalSecrets.enabled: false
    -   asserts:
            -   notEqual:
                    path: metadata.name
                    value: external-secrets-metrics-ingress
        it: Omits the metrics policy when observability is disabled