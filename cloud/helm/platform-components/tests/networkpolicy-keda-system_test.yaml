release:
    name: my-release
    namespace: argocd-system
set:
    networkPolicy.apiServerSources:
        -   ipBlock:
                cidr: 10.0.0.0/16
    operatorApplications.keda.enabled: true
suite: KEDA System NetworkPolicies
templates:
    -   templates/networkpolicy-keda-system.yaml
tests:
    -   asserts:
            -   documentSelector:
                    path: metadata.name
                    value: keda-admission-webhooks-ingress
                equal:
                    path: spec.ingress[0].from
                    value:
                        -   ipBlock:
                                cidr: 10.0.0.0/16
            -   documentSelector:
                    path: metadata.name
                    value: keda-operator-metrics-apiserver-ingress
                equal:
                    path: spec.ingress[0].from
                    value:
                        -   ipBlock:
                                cidr: 10.0.0.0/16
        it: Admits the API server sources to the admission webhooks and the metrics API server
    -   asserts:
            -   failedTemplate:
                    errorMessage: The value "networkPolicy.apiServerSources" must not be empty when "operatorApplications.keda.enabled" is true
        it: Fails without API server sources rather than admitting everyone
        set:
            networkPolicy.apiServerSources: []
    -   asserts:
            -   equal:
                    path: metadata.namespace
                    value: autoscaling
        it: Follows the KEDA application's namespace
        set:
            operatorApplications.keda.namespace: autoscaling
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits every NetworkPolicy when KEDA is disabled
        set:
            networkPolicy.apiServerSources: []
            operatorApplications.keda.enabled: false