components:
    schemas:
        AssetPermissionAction:
            discriminator:
                mapping:
                    ResetAssetPermissionAction: "#/components/schemas/ResetAssetPermissionAction"
                propertyName: type
            properties:
                className:
                    type: string
                classPK:
                    format: int64
                    type: integer
                type:
                    enum:
                        -   ResetAssetPermissionAction
                    type: string
        AssetStatistics:
            properties:
                approvedCount:
                    format: int64
                    readOnly: true
                    type: integer
                brokenLinksCount:
                    format: int64
                    readOnly: true
                    type: integer
                expiredCount:
                    format: int64
                    readOnly: true
                    type: integer
                expiringSoonCount:
                    format: int64
                    readOnly: true
                    type: integer
                inDraftCount:
                    format: int64
                    readOnly: true
                    type: integer
                pendingCount:
                    format: int64
                    readOnly: true
                    type: integer
                reviewDateOverdueCount:
                    format: int64
                    readOnly: true
                    type: integer
                scheduledCount:
                    format: int64
                    readOnly: true
                    type: integer
                totalCount:
                    format: int64
                    readOnly: true
                    type: integer
                upcomingReviewCount:
                    format: int64
                    readOnly: true
                    type: integer
        AssetUsage:
            properties:
                name:
                    type: string
                type:
                    type: string
                url:
                    type: string
        ResetAssetPermissionAction:
            allOf:
                -   $ref: "#/components/schemas/AssetPermissionAction"
        SimilarityCluster:
            description:
                A group of CMS content assets detected as near duplicates of one another.
            properties:
                similarityClusterAssets:
                    description:
                        The cluster's assets that fall inside the requested page. A cluster split across pages repeats in the next page with the remaining assets.
                    items:
                        $ref: "#/components/schemas/SimilarityClusterAsset"
                    readOnly: true
                    type: array
                size:
                    description:
                        The total number of assets in the cluster, independent of the requested page.
                    readOnly: true
                    type: integer
        SimilarityClusterAsset:
            description:
                A CMS content asset that belongs to a similarity cluster.
            properties:
                contentType:
                    description:
                        The localized label of the asset's content type.
                    readOnly: true
                    type: string
                dateModified:
                    format: date-time
                    readOnly: true
                    type: string
                id:
                    format: int64
                    readOnly: true
                    type: integer
                title:
                    readOnly: true
                    type: string
info:
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: ""
    version: v1.0
openapi: 3.0.1
paths:
    "/asset-permission":
        post:
            description:
                Perform an action on the asset's permissions
            operationId: postAssetPermission
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/AssetPermissionAction"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/AssetPermissionAction"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AssetPermissionAction"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/AssetPermissionAction"
            tags: ["AssetPermissionAction"]
    "/asset-statistics":
        get:
            operationId: getAssetStatistics
            parameters:
                -   in: query
                    name: assetLibraryId
                    schema:
                        format: int64
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AssetStatistics"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/AssetStatistics"
            tags: ["AssetStatistics"]
    "/asset-usages/{assetId}":
        get:
            operationId: getAssetUsagesAssetPage
            parameters:
                -   in: path
                    name: assetId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: page
                    schema:
                        type: integer
                -   in: query
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    name: search
                    schema:
                        type: string
                -   in: query
                    name: sort
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AssetUsage"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AssetUsage"
                                type: array
            tags: ["AssetUsage"]
    "/similarity-clusters":
        get:
            description:
                List the clusters of CMS content whose main text overlaps significantly, paginated by asset. Content is compared within one language, so a translation is only ever compared against the same translation of other content, and clustering always spans the whole space, so a cluster's size never depends on the requested page. Omit assetLibraryId to span all accessible spaces. Note that totalCount counts the clustered assets while the items are the clusters that hold them, so it is the number of assets that have a near duplicate rather than a page count, and a cluster that straddles a page boundary is returned on both pages with its full size.
            operationId: getSimilarityClustersPage
            parameters:
                -   in: query
                    name: assetLibraryId
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: page
                    schema:
                        type: integer
                -   in: query
                    name: pageSize
                    schema:
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/SimilarityCluster"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/SimilarityCluster"
                                type: array
            tags: ["SimilarityCluster"]