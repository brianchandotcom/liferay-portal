# A jsImportMapsEntry only registers the bundle under a bare specifier in the
# import map, so the custom element is placed by a fragment (see fragments) that
# writes its markup, including the <map-item> children shown in the tooltips

assemble:
    -   from: build/vite
        into: static
clarity-solution-custom-element-distributors-map-osm-with-slots:
    bareSpecifier: clarity-solution-custom-element-distributors-map-osm-with-slots
    name: Clarity Solution Custom Element Distributors Map OSM With Slots
    type: jsImportMapsEntry
    url: index.js