[#--
	Drop a Collection Display in the drop zone, with the map item fragment in its
	item. A Collection Display nests its items several levels deep while slots
	only project direct children, so fragment.js moves the <map-item> elements
	into the custom element.
--]

<div class="distributors-map-osm-with-slots-collection">
	<clarity-solution-custom-element-distributors-map-osm-with-slots></clarity-solution-custom-element-distributors-map-osm-with-slots>

	<div class="distributors-map-osm-with-slots-collection-items">
		<lfr-drop-zone data-lfr-drop-zone-id="collection"></lfr-drop-zone>
	</div>
</div>
