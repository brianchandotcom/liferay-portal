#
# OAuth
#

liferay-forums-etc-spring-boot-oahs.oauth2.headless.server.client.secret=${LIFERAY_FORUMS_ETC_SPRING_BOOT_OAHS_CLIENT_SECRET:myfancypassword}

liferay.oauth.application.external.reference.codes=\
    liferay-forums-etc-spring-boot-oahs,\
    liferay-forums-etc-spring-boot-oaua

#
# Only the readiness probe is unauthenticated. The object-action endpoints stay
# behind OAuth2 here, which is what PaaS/SaaS uses: the objectAction client
# extension registers its executor and calls them with a signed JWT.
# The "local" profile relaxes this -- see application-local.properties.
#
liferay.oauth.urls.excludes=/ready

#
# Spring Boot
#

server.port=58082

#
# Stop accepting object-action calls before the notification executor drains, so
# a rolling deploy is not racing new arrivals while it finishes queued work.
#

server.shutdown=graceful

#
# Liferay
#
# Base URL the microservice calls for JWKS validation and for the headless API
# calls (subscriber lookup, message-title fetch, ForumNotification writes,
# display-page URL construction). Override per environment with LIFERAY_BASE_URL:
#   Local dev: http://localhost:8080
#   PaaS:      https://webserver-<project>-<env>.lfr.cloud
#

liferay.api.base.url=${LIFERAY_BASE_URL:http://localhost:8080}

security.oauth2.resourceserver.jwk.jwk-set-uri=${liferay.api.base.url}/o/oauth2/jwks

#
# Optional Basic Auth fallback used by LiferayApiClient only when no JWT is
# forwarded on a call. Normally left blank — the incoming object-action JWT is
# forwarded as a Bearer token instead.
#
liferay.headless.api.user=${LIFERAY_HEADLESS_API_USER:test@liferay.com}
liferay.headless.api.password=${LIFERAY_HEADLESS_API_PASSWORD:test}

#
# Forum Notifications
#
# Delivery is performed by the Notification Object Actions on the
# ForumNotification object, so the From identity lives in the notification
# templates shipped by the site initializer, not here. This microservice only
# writes the per-recipient rows.
#
# forums.site.base.url is prepended to display-page links.
# forums.notification.purge deletes each row once its actions have run; set it
# to false if the environment executes object actions asynchronously.
#

forums.site.base.url=${FORUMS_SITE_BASE_URL:https://www.example.xyz}

#
# The validation payload carries the entry's fields and its creator, but not the
# site, so the ban lookup resolves the site by this code.
#
forums.site.external.reference.code=${FORUMS_SITE_EXTERNAL_REFERENCE_CODE:LIFERAY_FORUMS}

forums.notification.purge=${FORUMS_NOTIFICATION_PURGE:true}

#
# Notification fan-out executor
#
# Liferay calls an object action synchronously and waits for the response, so
# running the fan-out inline put every subscriber lookup, notification write and
# purge inside the poster's "Posting..." spinner. The handlers now acknowledge
# immediately and hand the work to this pool.
#
# The queue is deliberately short: each queued task retains the whole
# object-action payload and LCP.json allots the container 512 MB. Overflow runs
# on the calling thread, so an overloaded service degrades to the old inline
# latency rather than dropping a notification -- and that backpressure keeps the
# queue too shallow for a forwarded JWT to go stale in it.
#
# Await-termination stays well inside the default 30s SIGTERM->SIGKILL window so
# a rolling deploy drains rather than being cut off.
#

forums.notification.async.core.size=${FORUMS_NOTIFICATION_ASYNC_CORE_SIZE:2}
forums.notification.async.max.size=${FORUMS_NOTIFICATION_ASYNC_MAX_SIZE:8}
forums.notification.async.queue.capacity=${FORUMS_NOTIFICATION_ASYNC_QUEUE_CAPACITY:100}
forums.notification.async.await.termination.seconds=${FORUMS_NOTIFICATION_ASYNC_AWAIT_TERMINATION_SECONDS:10}

#
# forums.api.request.timeout.seconds bounds a single call to Liferay, and
# forums.notification.timeout.seconds bounds the whole fan-out for one reply.
# Both exist because the fan-out runs on its own thread with nothing observing
# it, so an unbounded call parks that thread for the life of the process and
# reports nothing at all.
#
forums.api.request.timeout.seconds=${FORUMS_API_REQUEST_TIMEOUT_SECONDS:15}
forums.notification.timeout.seconds=${FORUMS_NOTIFICATION_TIMEOUT_SECONDS:60}

logging.level.root=INFO
logging.level.com.liferay.forums=DEBUG
#
# Fallback values written onto a notification row when the topic title or the
# author name cannot be resolved. They are data rather than wording, so a
# template cannot supply them: it has no way to know a lookup failed.
#
forums.notification.fallback.author.name=${FORUMS_NOTIFICATION_FALLBACK_AUTHOR_NAME:A community member}
forums.notification.fallback.topic.title=${FORUMS_NOTIFICATION_FALLBACK_TOPIC_TITLE:Forum Discussion}