#
# Local development only, activated by run-local.sh via
# -Dspring.profiles.active=local. Never active on PaaS/SaaS.
#
# On a local Liferay bundle the objectAction client extension does not register
# its executor ("No object action executor found ..." in the portal log), so the
# object actions have to be bound as plain webhooks instead. A webhook carries
# no JWT, so these endpoints must accept unauthenticated calls for the local
# pipeline to work. The handlers tolerate a missing JWT and fall back to the
# configured Basic Auth credentials for their own outbound calls.
#
# This is a development convenience and a deliberate loosening of security: it
# leaves the object-action endpoints open to anything that can reach port 58082.

liferay.oauth.urls.excludes=/ready,/object-action/new-reply,/object-action/updated-reply